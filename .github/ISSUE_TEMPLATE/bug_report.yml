name: Bug report
description: Report behavior that does not match the documentation
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include real credentials or personal
        data. For security issues, follow `SECURITY.md` instead of opening a
        public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build with ...
        2. Run ./atm
        3. Choose ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: The commit SHA, branch, or "main" if you are unsure.
      placeholder: main
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: g++ 16.2.0, clang++ 18.1.0, ...
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal, iTerm2, GNOME Terminal, ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Paste the relevant terminal output. ANSI escape codes are fine.
      render: text
    validations:
      required: false
